name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: 安装 Buildozer 与适配版 jnius
        run: |
          pip install buildozer
          pip install "jnius>=1.4.0"

      - name: 编译 APK
        run: buildozer android debug

      - name: 保存编译产物
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk
