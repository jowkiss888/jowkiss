name: Final Build Test
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create test files
        run: |
          printf 'from kivy.app import App\nfrom kivy.uix.label import Label\n\nclass TestApp(App):\n    def build(self):\n        return Label(text="APK Test Success!")\n\nif __name__ == "__main__":\n    TestApp().run()\n' > main.py
          printf '[app]\ntitle = Test\npackage.name = test\npackage.domain = org.test\nsource.dir = .\nsource.include_exts = py\nversion = 0.1\nrequirements = python3,kivy\nandroid.api = 30\nandroid.minapi = 21\nandroid.ndk = 25b\nandroid.archs = arm64-v8a\nandroid.accept_sdk_license = True\n' > buildozer.spec

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: bin/*.apk
