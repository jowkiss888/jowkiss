name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Create minimal files
        run: |
          cat << 'EOF' > main.py
          from kivy.app import App
          from kivy.uix.label import Label

          class MainApp(App):
              def build(self):
                  return Label(text='APK Test Success!')

          if __name__ == '__main__':
              MainApp().run()
          EOF
          
          cat << 'EOF' > buildozer.spec
          [app]
          title = Test
          package.name = test
          package.domain = org.test
          source.dir = .
          source.include_exts = py
          version = 0.1
          requirements = python3,kivy
          android.api = 30
          android.minapi = 21
          android.ndk = 25b
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          EOF

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython

      - name: Build APK
        run: buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: bin/*.apk
